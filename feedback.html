			<h2> Help Me Improve My Portfolio </h2>

			<form id = "feedback-form" action = "#" target = "_blank" method = "post">
				<div class = "formInput">
					<label for = "name"> Your name:</label>

				</div>
				<div class = "formInput">
					<label for = "role"> I am a:</label>

						<option value = "student"> Fellow Student </option>
						<option value = "professor"> Professor </option>
						<option value = "recruiter"> Recruiter </option>
						<option value = "others"> Other </option>
					</select>
				</div>
				<div class = "formInput"> 
					<label for = "feedback"> Suggestions for Improvements: </label>
					<textarea id = "feedback" name = "feedback" rows = "6" placeholder = "Please enter your feedback here..." required></textarea>
				</div>
			
				<button type = "submit" id = "submitFeedback"> Submit Feedback </button>
			</form>
